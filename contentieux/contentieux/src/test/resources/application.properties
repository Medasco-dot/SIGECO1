spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
# H2 (tests) : schema derive directement des entites JPA, pas via Flyway (les migrations
# ciblent la syntaxe MySQL et ne sont pas garanties compatibles avec H2 meme en MODE=MySQL).
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.main.banner-mode=off
springdoc.api-docs.enabled=false
app.encryption.key=MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
app.login.max-tentatives=5
app.login.blocage-minutes=15
