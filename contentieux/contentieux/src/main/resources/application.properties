spring.application.name=contentieux
server.port=${SERVER_PORT:8082}
# Connexion à la base de données (à surcharger via variables d'environnement)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/carfo_contentieux}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# Configuration JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=never
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
app.cors.allowed-origins=http://localhost:4200,http://localhost:59854,http://localhost:59516,http://127.0.0.1:4200,http://127.0.0.1:59854,http://127.0.0.1:59516
app.jwt.secret=${JWT_SECRET:change-me}
# Endpoint /api/test/setup desactive par defaut (donnees de test - a activer uniquement en dev/smoke)
app.test-data.enabled=false
# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true
# OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
