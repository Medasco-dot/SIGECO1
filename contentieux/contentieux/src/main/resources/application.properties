spring.application.name=contentieux
server.port=${SERVER_PORT:8082}
# Connexion à la base de données (à surcharger via variables d'environnement)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/carfo_contentieux}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# Schema gere par Flyway (src/main/resources/db/migration) : Hibernate se contente de
# verifier que les entites correspondent au schema, il ne le modifie jamais lui-meme.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=never
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
app.cors.allowed-origins=http://localhost:4200,http://localhost:59854,http://localhost:59516,http://127.0.0.1:4200,http://127.0.0.1:59854,http://127.0.0.1:59516
app.jwt.secret=${JWT_SECRET:change-me}
# Cle de chiffrement AES (base64, 256 bits) pour les champs sensibles (numero CNIB). A generer
# avec: openssl rand -base64 32. Aucune valeur par defaut ici, volontairement : un demarrage
# sans cette variable doit echouer plutot que de chiffrer les CNIB avec une cle connue.
app.encryption.key=${FIELD_ENCRYPTION_KEY}
# Endpoint /api/test/setup desactive par defaut (donnees de test - a activer uniquement en dev/smoke)
app.test-data.enabled=false
# Anti brute-force sur /api/auth/login (cf. LoginAttemptService)
app.login.max-tentatives=5
app.login.blocage-minutes=15
# Limite de debit generale sur /api/** (cf. RateLimitFilter)
app.rate-limit.requetes-par-minute=120
# Actuator (metriques exposees pour scraping Prometheus : GET /actuator/prometheus)
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
# Logs structures : chaque ligne porte l'identifiant de correlation de la requete
# (cf. CorrelationIdFilter), pour retracer tous les evenements d'une meme requete.
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [reqId=%X{requestId}] %logger{36} - %msg%n
# OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
