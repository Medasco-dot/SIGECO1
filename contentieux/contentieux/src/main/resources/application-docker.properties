spring.datasource.url=jdbc:mysql://mysql:3306/${DB_NAME:carfo_contentieux}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:carfo}
spring.datasource.password=${DB_PASSWORD}
# docker-compose exige DB_PASSWORD, JWT_SECRET et FIELD_ENCRYPTION_KEY (aucune valeur par
# defaut ici, volontairement : un demarrage sans ces variables doit echouer plutot que de
# tourner avec un secret faible connu).
app.jwt.secret=${JWT_SECRET}
app.encryption.key=${FIELD_ENCRYPTION_KEY}
app.login.max-tentatives=5
app.login.blocage-minutes=15
# Schema gere par Flyway (voir application.properties) : premiere execution sur une base
# MySQL vide, cree l'integralite du schema versionne (V1, V2, V3...).
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
app.documents.storage=/app/uploads
app.documents.max-file-size=10MB
app.documents.allowed-content-types=application/pdf,image/png,image/jpeg,image/heic,application/vnd.openxmlformats-officedocument.wordprocessingml.document
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost}
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when-authorized
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
