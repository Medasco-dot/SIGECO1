spring.datasource.url=jdbc:mysql://mysql:3306/${DB_NAME:carfo_contentieux}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8mb4
spring.datasource.username=${DB_USERNAME:carfo}
